<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Cube / Inventory 3D Icon Graphic -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Top Face -->
    <path d="M 0,-110 L 105,-50 L 0,10 L -105,-50 Z" fill="#818cf8" stroke="#312e81" stroke-width="3" />
    
    <!-- Left Face -->
    <path d="M -105,-50 L 0,10 L 0,130 L -105,70 Z" fill="url(#boxGrad)" stroke="#312e81" stroke-width="3" />
    
    <!-- Right Face -->
    <path d="M 0,10 L 105,-50 L 105,70 L 0,130 Z" fill="#3730a3" stroke="#312e81" stroke-width="3" />

    <!-- Small decorative floating book / accent cube -->
    <g transform="translate(50, -40)">
      <path d="M 0,-35 L 35,-15 L 0,5 L -35,-15 Z" fill="#7dd3fc" />
      <path d="M -35,-15 L 0,5 L 0,45 L -35,25 Z" fill="url(#accentGrad)" />
      <path d="M 0,5 L 35,-15 L 35,25 L 0,45 Z" fill="#0369a1" />
    </g>
  </g>
</svg>
